name: Check

# On every push and pull request, on each Node LTS line the board supports: lint (ESLint and
# tsc for the server and the app), build (server and app), test (Vitest for the server, ng test
# for the app) and the smoke test (pack, global install into a temporary prefix, start it and
# fetch the app and the API). It's `npm run check`, the same as locally. It never publishes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
